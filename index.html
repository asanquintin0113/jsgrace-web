<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JS GRACE · Contacto</title>
<style>
:root{--bg:#f5f6f8;--ink:#14213d;--mut:#5b6577;--line:#d9dde5;--ac:#0f766e;--card:#fff;--err:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#0e1420;--ink:#e7ebf3;--mut:#9aa6bb;--line:#26324a;--ac:#2dd4bf;--card:#151d2e;--err:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:48px 20px}
h1{font-size:30px;line-height:1.2;margin:0 0 8px}
p.lead{color:var(--mut);margin:0 0 28px}
form{background:var(--card);border:1px solid var(--line);padding:22px;display:grid;gap:14px}
label{display:grid;gap:4px;font-size:14px;font-weight:600}
input[type=text],input[type=email],input[type=tel]{font:inherit;padding:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;font-weight:400;color:var(--mut)}
button{font:inherit;font-weight:600;padding:12px;border:0;background:var(--ac);color:var(--bg);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:24px;font-size:14px}.ok{color:var(--ac)}.error{color:var(--err)}
.hp{position:absolute;left:-9999px}
</style>
</head>
<body>
<main>
  <h1>JS GRACE</h1>
  <p class="lead">Déjanos tus datos y te contactaremos.</p>

  <form id="lead-form" novalidate>
    <label>Nombre <input type="text" name="name" autocomplete="name" maxlength="120" required></label>
    <label>Correo <input type="email" name="email" autocomplete="email" maxlength="200" required></label>
    <label>Teléfono o WhatsApp (opcional) <input type="tel" name="phone" autocomplete="tel" maxlength="30"></label>
    <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <label class="check"><input type="checkbox" name="consent" required>
      <span>Acepto que JS GRACE use mis datos para contactarme. [Pendiente: enlazar aquí tu aviso de privacidad.]</span></label>
    <button type="submit">Enviar</button>
    <div id="msg" role="status" aria-live="polite"></div>
  </form>
</main>

<script src="jsgrace-connector.js" data-endpoint="https://TU-PROYECTO.supabase.co/functions/v1/capture-lead"></script>
<script>
document.getElementById("lead-form").addEventListener("submit", function (e) {
  e.preventDefault();
  var form = e.target, msg = document.getElementById("msg"), btn = form.querySelector("button");
  if (!form.name.value.trim() || !form.email.value.trim() || !form.consent.checked) {
    msg.className = "error"; msg.textContent = "Completa tu nombre, correo y acepta el consentimiento."; return;
  }
  btn.disabled = true; msg.className = ""; msg.textContent = "Enviando…";
  window.JSGRACE.send({
    kind: "lead", name: form.name.value, email: form.email.value,
    phone: form.phone.value, website: form.website.value
  }).then(function (r) {
    if (!r.ok) throw new Error(r.status);
    msg.className = "ok"; msg.textContent = "¡Gracias! Recibimos tus datos y te contactaremos pronto.";
    form.reset();
  }).catch(function () {
    msg.className = "error"; msg.textContent = "No se pudo enviar. Revisa tus datos e inténtalo de nuevo.";
  }).finally(function () { btn.disabled = false; });
});
</script>
</body>
</html>
